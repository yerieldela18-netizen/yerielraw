name: Publicar portafolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar sitio
        uses: actions/checkout@v6
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Preparar sitio
        uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5
